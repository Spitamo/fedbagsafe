# dataset config
dataset:
  mode: 'fashionmnist'  # cifar10, cifar100, fashionmnist, femnist
  root: '.'
  data_dir: "./datasets"
  download: true

# model config
model:
  name: 'resnet9'
  dropout: 0.3
  pretrained: true
  checkpoint_dir: './checkpoints'
  load_pretrained: true

# federated learning config
federated:
  n_nodes: 100  
  n_rounds: 100
  samples_per_client: 400
  min_samples: null
  max_samples: null
  local_epochs: 1
  fail_safe_alpha: 0.98

# training config
training:
  batch_size: 8
  eval_batch_size: 64
  num_workers: 0
  learning_rate: 5.0e-5 # ensure PyYAML parses scientific notation as float
  weight_decay: 1.0e-2
  gradient_clip: 1.0

# attack config
attack:
  enabled: true
  malicious_clients: 24
  target_label: 9
  types:
    - 'clean'
    - 'backdoor'
    - 'label_flip'
    - 'model_poisoning'

# he config
encryption:
  enabled: false  # set true to enable he aggregation
  type: 'CKKS'
  poly_modulus_degree: 8192
  coeff_mod_bit_sizes: [60, 40, 40, 60]
  global_scale: 1099511627776

# aggregation config
aggregation:
  mode: 'uniform_average'
  he_enabled: null  # override encryption.enabled if set
  selection_strategy: 'random'

# device config
device:
  type: 'cpu'
  accelerator: 'cpu'  # auto, cpu, or cuda
  devices: 1

# logging config
logging:
  level: 'INFO'
  verbose: true
  save_logs: false
  log_file: 'federated_learning.log'

# checkpointing
checkpoint:
  enabled: true
  save_dir: './checkpoints'
  save_interval: 5

# random seed
seed: 42

# experiment phases
phases:
  stable_initialization: 10
  gradual_attack_introduction: 15
  moderate_attack_frequency: 25
  high_intensity_attacks: 25
  consecutive_attack_stress_test: 10
  recovery_and_final_validation: 15